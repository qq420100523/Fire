name: build installer.pkg

on:
  workflow_dispatch:
    inputs: 
      version:
        description: "版本号 (如 v0.28.0)"
        required: true
        type: string
      release_notes:
        description: "版本描述 (Markdown，可选)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git Ref (分支/标签/SHA，留空使用默认分支)"
        required: false
        type: string
        default: ""
      code_sign:
        description: "Code Sign"
        required: true
        type: choice
        options:
          - enable
          - disable
  pull_request:
    types: [closed]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master' || github.event_name == 'workflow_dispatch'
    outputs:
      skipped: ${{ github.event_name == 'workflow_dispatch' && 'false' || steps.changelog.outputs.skipped }}
      next_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || steps.changelog.outputs.tag }}
      changelog_html: ${{ steps.create_html.outputs.html }}
      changelog: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || (github.event_name == 'workflow_dispatch' && steps.gitlog.outputs.changelog || steps.changelog.outputs.clean_changelog) }}
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || steps.checkout.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        if: github.event_name != 'workflow_dispatch' || inputs.release_notes == ''
        with:
          submodules: false
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        if: github.event_name != 'workflow_dispatch' || inputs.release_notes == ''
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit: "true"
          output-file: "false"

      - name: Generate changelog from git log
        id: gitlog
        if: github.event_name == 'workflow_dispatch' && inputs.release_notes == ''
        run: |
          FROM="$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          {
            echo 'changelog<<EOF'
            git log --oneline "$FROM..HEAD" | grep -E '^[a-f0-9]+ (feat|fix)' | sed -E 's/^[a-f0-9]+ /- /' || echo "- 无显著变更"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      
      - name: combine donation and changelog
        id: combine_text
        env:
          CHANGELOG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || (github.event_name == 'workflow_dispatch' && steps.gitlog.outputs.changelog || steps.changelog.outputs.clean_changelog) }}
        run: |
          {
            echo "text<<ENDOFTEXT"
            echo "$CHANGELOG"
            echo ''
            echo '### 💰 打赏支持'
            echo '如果本项目对你有帮助，欢迎[请作者喝杯咖啡](https://github.com/qwertyyb/Fire#-打赏支持)，你的支持是持续更新的动力~'
            echo ''
            echo '<img alt="微信赞赏码" src="https://cdn.qwertyyb.cn/static/wx.jpg" width="200">'
            echo "ENDOFTEXT"
          } >> "$GITHUB_OUTPUT"

      - uses: lifepal/markdown-to-html@v1.2
        id: create_html
        with:
          text: ${{ steps.combine_text.outputs.text }}

  build_binary:
    runs-on: macos-latest
    needs: changelog

    env:
      USE_CODE_SIGN: ${{ inputs.code_sign == 'enable' && github.actor_id == github.repository_owner_id && 'enable' || 'disable' }}
      NEXT_VERSION: ${{ needs.changelog.outputs.next_version }}

    if: needs.changelog.outputs.skipped == 'false'

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        ref: ${{ needs.changelog.outputs.ref }}

    # - name: switch xcode version
    #   run: sudo xcode-select --switch /Applications/Xcode_14.3.1.app
    
    - name: import application certificate
      if: env.USE_CODE_SIGN == 'enable'
      id: keychain
      uses: apple-actions/import-codesign-certs@v7
      with: 
        p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
        p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

    - name: import installer certificate
      if: env.USE_CODE_SIGN == 'enable'
      uses: apple-actions/import-codesign-certs@v7
      with:
        create-keychain: false
        keychain-password: ${{ steps.keychain.outputs.keychain-password }}
        p12-file-base64: ${{ secrets.CERTIFICATES_INSTALLER_P12 }}
        p12-password: ${{ secrets.CERTIFICATES_INSTALLER_P12_PASSWORD }}

    - name: prepare sqlcipher
      run: ./scripts/0_prepare_sqlcipher.sh

    - name: build Fire.app
      run: ./scripts/a_build_app.sh

    - name: build FireInstaller.pkg
      run: ./scripts/b_build_installer.sh

    - name: notarize FireInstaller.pkg
      if: env.USE_CODE_SIGN == 'enable'
      env:
        apple_id: ${{ secrets.APPLE_ID }}
        apple_id_password: ${{ secrets.APPLE_ID_PASSWORD }}
        team_id: ${{ secrets.TEAM_ID }}
      run: ./scripts/c_notarize_installer.sh

    - name: generate appcast.xml
      env:
        sparkle_key: ${{ secrets.sparkle_key }}
        update_notes: ${{ needs.changelog.outputs.changelog_html }}
      run: |
        if [ -z "$sparkle_key" ]; then
          echo "sparkle_key 未设置，跳过 appcast 生成"
          mkdir -p "${{ github.workspace }}/dist"
          exit 0
        fi
        ./scripts/d_build_appcast.sh

    - name: gather artifact
      run: cp ./Fire/Info.plist ./dist/

    - uses: actions/upload-artifact@v7
      with:
        name: installer
        path: ./dist/FireInstaller.pkg
        retention-days: 7

  create_release:
    runs-on: ubuntu-latest
    needs: [changelog, build_binary]
    permissions:
      contents: write

    if: needs.changelog.outputs.skipped == 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changelog.outputs.ref }}
          submodules: false

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: ./dist

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name == 'dev' && format('{0}-dev', needs.changelog.outputs.next_version) || needs.changelog.outputs.next_version }}
          name: ${{ github.ref_name == 'dev' && format('{0}-dev', needs.changelog.outputs.next_version) || needs.changelog.outputs.next_version }}
          body: ${{ needs.changelog.outputs.changelog }}
          prerelease: ${{ github.ref_name == 'dev' }}
          files: |
            ./dist/FireInstaller.pkg

      - name: deploy appcast to gh-pages
        if: github.ref_name == 'dev' && github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
            if [ -f dist/appcast.xml ]; then
              mv dist/appcast.xml ./appcast.xml
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git add appcast.xml
              git commit -m "feat: 更新appcast.xml ${{ needs.changelog.outputs.next_version }} build ${{ needs.changelog.outputs.ref }}"
              git push origin gh-pages
            fi
          else
            echo "gh-pages not found, skip appcast deploy"
          fi
